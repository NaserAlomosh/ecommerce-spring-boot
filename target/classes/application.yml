spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: ecommerce-spring-boot
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        implicit-strategy: org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
    properties:
      hibernate:
        format_sql: true
        validator:
          apply_to_ddl: true
          autoregister_listeners: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:25}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    from: ${SMTP_FROM:no-reply@example.com}
    properties:
      mail:
        smtp:
          starttls:
            enable: ${SMTP_TLS:false}
            required: ${SMTP_STARTTLS_REQUIRED:true}
          ssl:
            enable: ${SMTP_SSL:false}
          connectiontimeout: ${SMTP_CONNECTION_TIMEOUT:10000}
          timeout: ${SMTP_TIMEOUT:60000}
          writetimeout: ${SMTP_WRITE_TIMEOUT:60000}
    retry:
      max-attempts: ${SMTP_RETRY_MAX_ATTEMPTS:2}
      backoff-millis: ${SMTP_RETRY_BACKOFF_MILLIS:1000}

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}
    expiration-millis: ${JWT_EXPIRATION_MILLIS:900000}
  auth:
    refresh-token-expiration: ${REFRESH_TOKEN_EXPIRATION:30d}
    otp-expiration: ${OTP_EXPIRATION:5m}
    otp-resend-cooldown: ${OTP_RESEND_COOLDOWN:1m}
    otp-max-attempts: ${OTP_MAX_ATTEMPTS:5}
    password-reset-token-expiration: ${PASSWORD_RESET_TOKEN_EXPIRATION:15m}
    google-audience: ${GOOGLE_AUDIENCE:}
    apple-audience: ${APPLE_AUDIENCE:}
  bootstrap:
    admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
      first-name: ${BOOTSTRAP_ADMIN_FIRST_NAME:System}
      last-name: ${BOOTSTRAP_ADMIN_LAST_NAME:Admin}
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      phone-number: ${BOOTSTRAP_ADMIN_PHONE:+10000000000}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}

  dashboard:
    low-stock-threshold: ${DASHBOARD_LOW_STOCK_THRESHOLD:10}
  file-storage:
    type: ${FILE_STORAGE_TYPE:local}
    upload-dir: ${FILE_UPLOAD_DIR:uploads}
    max-image-size: ${MAX_IMAGE_SIZE:5MB}
    max-images-per-product: ${MAX_IMAGES_PER_PRODUCT:10}
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}
      folder: ${CLOUDINARY_FOLDER:products}

  business-time-zone: ${BUSINESS_TIME_ZONE:Asia/Amman}
  reports:
    max-pdf-rows: ${REPORTS_MAX_PDF_ROWS:5000}
    default-export-range-days: ${REPORTS_DEFAULT_EXPORT_RANGE_DAYS:31}
    max-export-range-days: ${REPORTS_MAX_EXPORT_RANGE_DAYS:366}
    company-name: ${REPORTS_COMPANY_NAME:Smart E-Commerce}
    logo-path: ${REPORTS_LOGO_PATH:}
    footer-text: ${REPORTS_FOOTER_TEXT:Confidential administrative report}
    vip-min-spending: ${REPORTS_VIP_MIN_SPENDING:1000.00}
    vip-min-orders: ${REPORTS_VIP_MIN_ORDERS:10}
    pdf:
      regular-font: ${REPORTS_PDF_REGULAR_FONT:classpath:fonts/DejaVuSans.ttf.base64}
      bold-font: ${REPORTS_PDF_BOLD_FONT:classpath:fonts/DejaVuSans.ttf.base64}
      arabic-font: ${REPORTS_PDF_ARABIC_FONT:classpath:fonts/DejaVuSans.ttf.base64}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
